[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codename-47"
version = "0.1.0"
description = "A deception framework for detecting, fingerprinting and de-anonymising LLM-driven pentesting agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bilel Cherif", email = "bilel.cherif@tacticalabs.ai" }]
keywords = ["honeypot", "deception", "prompt-injection", "llm-agent", "threat-intel"]

dependencies = [
    "aiohttp>=3.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
cowrie = ["watchfiles>=0.21"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
all = ["anthropic>=0.40", "watchfiles>=0.21"]

[project.scripts]
c47 = "c47.cli:main"

# Third-party plugins register themselves against these groups.
[project.entry-points."c47.lures"]
html_comment_bait = "c47.lures.html_comment:HtmlCommentBait"
ansi_invisible = "c47.lures.ansi_invisible:AnsiInvisibleLure"
zero_width = "c47.lures.ansi_invisible:ZeroWidthLure"
canary_fetch = "c47.lures.canary_fetch:CanaryFetchLure"
identity_disclosure = "c47.lures.canary_fetch:IdentityDisclosureLure"
system_prompt_exfil = "c47.lures.system_prompt:SystemPromptExfilLure"
campaign_debrief = "c47.lures.system_prompt:CampaignDebriefLure"
reasoning_probe = "c47.lures.reasoning_probe:ReasoningProbeLure"
tool_poison = "c47.lures.tool_poison:ToolPoisonLure"
decoy_tools = "c47.lures.tool_poison:DecoyToolInvocationLure"
markdown_exfil = "c47.lures.markdown_exfil:MarkdownExfilLure"
robots_bait = "c47.lures.robots_bait:RobotsBaitLure"

[project.entry-points."c47.detectors"]
expectations = "c47.detectors.expectations:ExpectationDetector"
timing = "c47.detectors.timing:TimingDetector"
ua_churn = "c47.detectors.http_behaviour:UserAgentChurnDetector"
method_fanout = "c47.detectors.http_behaviour:MethodFanoutDetector"
header_anomaly = "c47.detectors.http_behaviour:HeaderAnomalyDetector"
path_semantics = "c47.detectors.http_behaviour:PathSemanticsDetector"
command_semantics = "c47.detectors.shell_behaviour:CommandSemanticsDetector"
recon_sequence = "c47.detectors.shell_behaviour:ReconSequenceDetector"
prompt_leak = "c47.detectors.prompt_leak:PromptLeakDetector"
mcp_protocol = "c47.detectors.mcp_behaviour:McpProtocolDetector"
llm_judge = "c47.detectors.llm_judge:LLMJudgeDetector"

[project.entry-points."c47.llm"]
anthropic = "c47.llm.anthropic_backend:AnthropicBackend"

[project.entry-points."c47.surfaces"]
http = "c47.surfaces.http.surface:HttpSurface"
mcp = "c47.surfaces.mcp.surface:McpSurface"
cowrie = "c47.surfaces.cowrie.surface:CowrieSurface"

[project.entry-points."c47.sinks"]
jsonl = "c47.sinks.jsonl:JsonlSink"
console = "c47.sinks.console:ConsoleSink"
sqlite = "c47.sinks.sqlite:SqliteSink"
webhook = "c47.sinks.webhook:WebhookSink"

[tool.setuptools.packages.find]
include = ["c47*"]

[tool.setuptools.package-data]
"c47.surfaces.http" = ["personas/*.html", "personas/*.toml"]
"c47.surfaces.cowrie" = ["overlay/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
